name: Test arch Win32 (normalized to x86)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure pwsh is available
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO=sudo
            case "$(uname -m)" in
              aarch64|arm64) PARCH=arm64 ;;
              *) PARCH=x64 ;;
            esac
            curl -fsSL -o /tmp/pwsh.tar.gz "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell-7.4.6-linux-${PARCH}.tar.gz"
            $SUDO mkdir -p /opt/microsoft/powershell/7
            $SUDO tar zxf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7
            $SUDO chmod +x /opt/microsoft/powershell/7/pwsh
            $SUDO ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
            echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> "$GITHUB_ENV"
            export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          fi
          pwsh --version
      - id: action
        uses: .
        with:
          arch: Win32
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "${VSCMD_ARG_TGT_ARCH:-}" ]; then
            echo "FAIL: VSCMD_ARG_TGT_ARCH unexpectedly set on non-Windows"
            exit 1
          fi
          echo "PASS"
