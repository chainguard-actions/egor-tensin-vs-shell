name: Test arch normalization arm to arm64
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -qq
            apt-get install -y -qq wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -qq
            apt-get install -y -qq powershell
          fi
          pwsh --version
      - id: action
        uses: .
        with:
          arch: arm
      - name: Assert action completed without error
        run: |
          echo "PASS: action accepted arch=arm and completed successfully on Linux (VS setup skipped gracefully)"
