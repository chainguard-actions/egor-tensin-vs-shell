name: Test basic usage (default arch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell
        run: |
          which pwsh && echo "pwsh already installed" && exit 0
          apt-get update -qq && apt-get install -y -qq powershell || \
          (wget -q https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb -O /tmp/packages-microsoft-prod.deb && \
           dpkg -i /tmp/packages-microsoft-prod.deb && \
           apt-get update -qq && apt-get install -y -qq powershell)
      - id: action
        uses: .
        # No inputs — uses default arch (x64)
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully on Linux (non-Windows skip path)"
          echo "PASS"
