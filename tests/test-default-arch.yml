name: Test default arch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install PowerShell if needed
        run: |
          if ! command -v pwsh &>/dev/null; then
            apt-get update -y
            apt-get install -y wget apt-transport-https software-properties-common
            wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
            dpkg -i packages-microsoft-prod.deb
            apt-get update -y
            apt-get install -y powershell
          fi
          pwsh --version
      - id: action
        uses: .
        # No arch input - should default to x64
      - name: Assert action completed without error using default arch
        run: |
          echo "Action completed successfully with default arch (x64)"
          echo "PASS: action ran without error using default arch"
